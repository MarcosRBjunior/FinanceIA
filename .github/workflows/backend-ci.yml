name: Backend CI

on:
  push:
    branches: [specs, main]
    paths: ['backend/**']
  pull_request:
    branches: [specs, main]
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test
        run: npm test
