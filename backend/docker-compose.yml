services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classificador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classificador}
      POSTGRES_DB: ${POSTGRES_DB:-classificador_transacoes}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-classificador}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
